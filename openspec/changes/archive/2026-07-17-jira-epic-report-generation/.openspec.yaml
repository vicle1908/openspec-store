description: |
  Automated Jira epic report generation system that analyzes epics, tasks,
  and sprint allocations to produce comprehensive status reports with risk
  analysis and actionable recommendations. Built in Python with uv, extending
  the existing jira-comprehensive-management skill (jira_mgmt package).

