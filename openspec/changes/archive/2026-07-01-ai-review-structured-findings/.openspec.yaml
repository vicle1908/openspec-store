description: >
  Current ai-review publishes findings as raw strings with hardcoded severity.
  This change adds:
  - Structured finding model with severity, file, line, message
  - Regex-based finding extraction from LLM output
  - Validation against diff context
  - Cross-reviewer deduplication
  - Security fixes (path traversal, timing-safe comparison)
