title: Jira Reports Consolidation
description: |
  Ecosystem architecture with tdt-core shared package + jira-daily-reports Python CLI.
  Replaces bash/acli scripts with Python, adds Sprint Report Sheet with Person Capacity,
  enriches with estimation/dates/worklog metadata, and provides 13 reporting commands.

