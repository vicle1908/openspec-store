key_deliverables:
  sprint_report_sheet:
    status: complete
    features:
      - 17 columns including Work Type, Target/Actual Status, Verdict
      - HYPERLINK formulas for Filter, Board, all issue keys
      - Target status from bucket sheets with "Done" fallback
      - Estimation/Start/End Date/Logwork enrichment
      - Sprint health summary with risk metrics
      - 5 source transparency columns (Target/Estimation/Start/End/Logwork Source)
    outputs: Google Sheets, markdown, JSON, terminal
  person_capacity:
    status: complete
    features:
      - Planning-aligned layout (14+ columns when mapping available)
      - Jira-only fallback layout (9+ columns)
      - Ownership metrics (assigned tickets, original estimate)
      - Activity metrics (worked tickets, logged total, daily breakdown)
      - Daily date columns from sprint dates or rolling 14-day window
      - Reconciliation section (unmapped people, formula drift)
    outputs: Companion tab in same Sprint Report Google Sheet
  reporting_commands:
    count: 14
    commands:
      - standup (daily 8 AM weekdays)
      - blocked (daily 9 AM weekdays)
      - missing-info (daily 8:30 AM weekdays)
      - wip (daily 5 PM weekdays)
      - velocity (daily 10 AM weekdays)
      - platform (daily 10 AM weekdays)
      - priority (daily 10 AM weekdays)
      - code-review (daily 2 PM weekdays)
      - sprint-health (daily 10 AM weekdays)
      - sprint-sheet (hourly, drives Sprint Report + Person Capacity tabs)
      - dashboard (on-demand)
      - cycle-time (weekly Fri 6 PM)
      - wip-age (daily 5 PM weekdays)
      - remind (daily 9 AM weekdays — @mention reminders for missing fields)
    scheduler: DBOS-backed tdt-scheduler Docker service
  scheduler_only_commands:
    # Not user-facing CLIs; registered as DBOS workflows for automated execution.
    # Code lives alongside the user-facing reports in dbos_scheduling.py.
    count: 3
    commands:
      - run-all (daily 7 AM — off-peak orchestration: all reports + sprint-sheet)
      - catalog-refresh (daily 3 AM — delta update of Jira metadata catalog)
      - dev-performance (hourly — Developer Performance tab refresh)

