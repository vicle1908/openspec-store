notes: |
  This change is implemented and the shipped contract is exercised by focused verification
  across `jira-skill` and its consumer adapters.
  
  Phase 5 (RCA + Prevention) is implemented with GitLab SCM enhancement:
  - RootCauseSignal and FixStatusSignal (9 total signals)
  - FilterSnapshotCollector and FilterRegistryReader
  - SheetsBundleWriter for Google Sheets export
  - Unified CLI with analyze-filter command (includes --filter-url, --auto)
  - Continuous and incremental modes
  - All 8 test fixtures updated with Phase 5 fields
  - RCA patterns consolidated to canonical module
  - Dynamic filter URL resolution implemented
  - Skill documentation aligned to the current surface
  
  GitLab SCM Evidence Integration (2026-06-07):
  - New modules: gitlab_evidence.py, scm_evidence.py
  - Structured intelligence models: BranchRole, MergeRequestState, PipelineState
  - GitlabEvidenceProvider with bounded concurrency (Semaphore(8))
  - Branch role classification, MR state tracking, pipeline state resolution
  - Confidence scoring for evidence reliability
  - Enhanced collector with async GitLab enrichment
  
  Outstanding future enhancements (non-blocking):
  - HIGH: Promote structured SCM evidence to first-class bundle fields
  - MEDIUM: GitLab provider caching/batching optimization
  - MEDIUM: Broader repo-resolution heuristics
