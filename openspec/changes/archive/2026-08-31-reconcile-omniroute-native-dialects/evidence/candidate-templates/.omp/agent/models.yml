providers:
  omniroute-anthropic:
    baseUrl: http://localhost:20128
    apiKey: OMNIROUTE_API_KEY
    api: anthropic-messages
    auth: apiKey
    models:
      - id: pm/Claude-Fable
        name: pm/Claude-Fable
        reasoning: true
        input: [text, image]
        contextWindow: 200000
        maxTokens: 32000
        thinking:
          mode: anthropic-budget-effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
  omniroute-chat:
    baseUrl: http://localhost:20128
    apiKey: OMNIROUTE_API_KEY
    api: openai-completions
    auth: apiKey
    models:
      - id: sh/gpt-5.6-sol
        name: sh/gpt-5.6-sol (versionless chat fallback)
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        thinking:
          mode: effort
          efforts: [low, medium, high]
          defaultLevel: high
