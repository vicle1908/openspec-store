schema: spec-driven

context: |
  # Multi-Project Workspace

  ## Go Microservices Platform
  - 8 independently deployable Go services, shared platform module
  - PostgreSQL, Kafka, Debezium CDC, Temporal, Redis, OTLP observability
  - Architecture: DDD, hexagonal, CQRS-style handlers, ports/adapters
  - Contracts: Protobuf managed with Buf; REST for MVP client API
  - Operations: Docker Compose local, kind K8s validation, Argo CD GitOps
  - Quality: structured logging, health checks, unit + integration tests

  ## TDT Mobile Platform Ecosystem
  - Mobile Apps: Swift (iOS), Kotlin (Android)
  - Backend Services: Python 3.14 (FastAPI), Go (webhook-receiver)
  - Infrastructure: Docker, launchd, uv (Python packaging)
  - Databases: PostgreSQL, Redis
  - APIs: Jira Cloud API v3, GitLab API v4, Google Sheets API
  - Core Libraries: tdt_core SDK (JiraClientFactory, GitLabClientFactory)
  - Agent Framework: Pydantic AI v2, DBOS durable execution

  ## Agent Ecosystem (Python 3.14, uv)
  - agent-core: Shared agent runtime — foundation, tool registry, skill system,
    memory, LLM gateway, agent_base (ReAct), resilience, orchestration (LangGraph),
    evaluation, observability, CLI, SDK. Depends on tdt-core.
  - agent-docs-sync: Documentation synchronization agent built on agent-core.
    Detects code changes, maps to docs, validates links, orchestrates multi-repo sync.
  - agent-harness: Planning harness for engineering tickets — 12-stage LangGraph
    workflow with durable checkpointing, evidence-backed validation, human gates.
    Read-only authority, artifact-root writes only. Depends on agent-core + tdt-core.
  - Naming convention: agent-core-*, agent-docs-sync-*, agent-harness-* prefixes.
    Standalone harness-skill specs live under _standalone/ in the store.
  - Each repo has SPEC_INDEX.md mapping specs to modules and docs.

operations:
  apply:
    guidance:
      - Preserve existing work, read the nearest applicable AGENTS.md and owning documentation, and keep edits within the selected change and repository root.
      - Read every concrete context file returned by the apply instructions before implementation and treat explicit user choices and repository policy as controlling.
      - Run focused verification for each completed task, record exact evidence, and mark a checkbox complete only after its implementation and check succeed.
  archive:
    guidance:
      - Ensure the affected change has no incomplete tasks, then sync any modified delta specs to main specs before archiving.
      - Validate the archived state, confirm the spec sync preserved all scenarios, and record the archived change for downstream verification.

rules:
  proposal:
    - State the problem in one sentence before elaborating.
    - List explicit non-goals.
    - Identify affected ownership boundaries.
  specs:
    - Every normative requirement SHALL use SHALL or MUST.
    - Every requirement SHALL have at least one scenario.
    - Cover success, failure, and edge cases where applicable.
  design:
    - Reference existing patterns before introducing new ones.
    - State transaction boundaries where affected.
  tasks:
    - Use hierarchical numbering such as 1, 1.1, and 1.2.
    - Each task SHALL be completable in one session.
    - Include explicit verification steps.
