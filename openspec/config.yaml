schema: spec-driven

context: |
  # Multi-Project Workspace

  ## Go Microservices Platform (GREENFIELD)
  - 8 independently deployable Go services, shared platform module
  - PostgreSQL 18.4 (182 tables, 1210 stored procedures, 68 views)
  - Kafka 4.3.1, Debezium CDC 3.6, Temporal 1.31.2, Redis, OTLP observability
  - Architecture: DDD, hexagonal, CQRS-style handlers, ports/adapters
  - Contracts: Protobuf managed with Buf; REST for MVP client API
  - Operations: Docker Compose local (41 services), kind K8s validation, Argo CD GitOps
  - Quality: structured logging, health checks, unit + integration tests
  - **Greenfield: no legacy data, no migration constraints, rewrite freely**

  ## TDT Mobile Platform Ecosystem
  - Mobile Apps: Swift (iOS), Kotlin (Android)
  - Backend Services: Python 3.14 (FastAPI), Go (webhook-receiver)
  - Infrastructure: Docker, launchd, uv (Python packaging)
  - Databases: PostgreSQL, Redis
  - APIs: Jira Cloud API v3, GitLab API v4, Google Sheets API
  - Core Libraries: tdt_core SDK (JiraClientFactory, GitLabClientFactory)
  - Agent Framework: Pydantic AI v2, DBOS durable execution

  ## SHB Banking Ecosystem (Python 3.14, uv)
  - Autonomous Agent Platform (12 Repositories): shb-core (SDK & auth), shb-agent-core (Pydantic AI v2), shb-agent-harness (12-stage LangGraph), shb-ai-harness-skills (harness-13 schemas), shb-agent-skills (38+ engineering skills from vds-skills), shb-browser-cli (Playwright CDP), shb-ai-review (automated MR reviews), shb-webhook-receiver (FastAPI webhook & DLQ), shb-jira-tools (Jira delivery tracking & ADF), shb-mcp-servers (MCP stdio/SSE servers), shb-observability (OTel collector & dashboard), shb-tools (operational automation & docker nexus).
  - Centralized OpenSpec store under specs/shb-*/. Each repo has SPEC_INDEX.md.

  ## OmniRoute (AI Gateway)
  - OmniRoute — AI gateway with 290+ providers, 90+ free tiers (running image v3.8.51; upgraded 2026-10-03; image tracks `latest`)
  - Location: ~/Omniroute (upstream source checkout that doubles as the deployment dir; not a workspace repo)
  - Deployment: Docker Compose `base` profile via Docker Hub image (`diegosouzapw/omniroute:latest`), run from ~/Omniroute
  - Ports: 20128 (dashboard), 20129 (API bridge), 20132 (LiveWS) — bound to 127.0.0.1 ONLY (official hardened pattern per README quick-run + VM guide; not LAN-accessible)
  - Security: OMNIROUTE_WS_BRIDGE_SECRET set in .env (official guide: required in production); redis not host-published
  - Proxy: ENABLE_SOCKS5_PROXY=false + NEXT_PUBLIC_ENABLE_SOCKS5_PROXY=false in .env (fixed 2026-08-25). Half-enabled proxy (flags true, no ALL_PROXY/HTTPS_PROXY endpoint) wraps every outbound fetch through a dead proxy agent -> PROXY_UNREACHABLE, credential health timeouts, event-loop backlog, container unhealthy. Rule: proxy must be fully disabled OR fully configured (flags + reachable endpoint), never half-enabled
  - Redis: compose `redis:7-alpine` service, internal network only (NOT published to host; `ports: !reset []` in override)
  - Persistence: Docker named volume `omniroute-data` → /app/data (SQLite, UID 1000). NOT a bind mount — Docker Desktop virtiofs bind mounts corrupt SQLite WAL DBs. Access via `docker cp` / in-container sqlite3. `restart: unless-stopped`
  - Reboot survival: Docker Desktop is a login item — recovers after user LOGIN (not bare boot)
  - Override: untracked `docker-compose.override.yml` = deployment infrastructure (Hub image + redis port reset + named-volume override via `!override`); verify before every start
  - Update tracking: LaunchAgent `com.omniroute.update-check` runs `~/Omniroute/scripts/check-upstream.sh` every 12h (StartInterval 43200, RunAtLoad). Compares local image INDEX digest vs remote INDEX digest via `docker buildx imagetools inspect`; writes flag `~/.omniroute/update-available` + macOS notification when upstream is newer. Logs to `~/.omniroute/update-check.log`
  - Update (on-demand, fail-closed): `~/Omniroute/scripts/update.sh <version>` — snapshots and integrity-checks SQLite, pulls only `omniroute-base`, verifies flagged digest, recreates with `--no-deps --force-recreate`, waits healthy, verifies version/image/endpoints/data/invariants, and clears the flag only after all gates pass. Current target: v3.8.51, index digest `sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218`; applied 2026-10-03. Manual fallback: `cd ~/Omniroute && docker compose --profile base pull omniroute-base && docker compose --profile base up -d --no-build --pull never --no-deps --force-recreate omniroute-base`
  - Password: bcrypt hash in SQLite is authoritative; `INITIAL_PASSWORD` in .env only seeds first boot. Reset via `node bin/reset-password.mjs --password-stdin`
  - History: migrated 2026-08-24 from launchd (crash-looping server + hourly source-rebuild updater, both removed); data migrated from ~/.omniroute (kept as pre-cutover rollback copy)

  ## Agent Ecosystem (Python 3.14, uv)
  - agent-core: Shared agent runtime — foundation, tool registry, skill system,
    memory, pydantic-ai model resolution, agent_base (ReAct), orchestration (LangGraph),
    evaluation, observability, CLI, SDK. Depends on tdt-core.
  - agent-docs-sync: Documentation synchronization agent built on agent-core.
    Detects code changes, maps to docs, validates links, orchestrates multi-repo sync.
  - agent-harness: Planning harness for engineering tickets — 12-stage LangGraph
    workflow with durable checkpointing, evidence-backed validation, human gates.
    Read-only authority, artifact-root writes only. Depends on agent-core + tdt-core.
  - Naming convention: agent-core-*, agent-docs-sync-*, agent-harness-* prefixes.
    Standalone harness-skill specs live under _standalone/ in the store.
  - Each repo has SPEC_INDEX.md mapping specs to modules and docs.

operations:
  apply:
    guidance:
      - Preserve existing work, read the nearest applicable AGENTS.md and owning documentation, and keep edits within the selected change and repository root.
      - Read every concrete context file returned by the apply instructions before implementation and treat explicit user choices and repository policy as controlling.
      - Run focused verification for each completed task, record exact evidence, and mark a checkbox complete only after its implementation and check succeed.
  archive:
    guidance:
      - Ensure the affected change has no incomplete tasks, then sync any modified delta specs to main specs before archiving.
      - Validate the archived state, confirm the spec sync preserved all scenarios, and record the archived change for downstream verification.
      - When a change performed verification work, record its evidence in a
        single `evidence.md` file inside the change directory before archiving;
        a change that performed no verification is not required to carry one.
      - Never add, remove, edit, move, or rewrite files in an already-archived
        change directory. Archived changes are immutable. Corrective evidence
        and corrections are written to a new active change, which restores the
        archive to its pre-edit state. The legacy `evidence/` directory form is
        grandfathered for changes already archived with it and is not migrated.

rules:
  proposal:
    - State the problem in one sentence before elaborating.
    - List explicit non-goals.
    - Identify affected ownership boundaries.
  specs:
    - Every normative requirement SHALL use SHALL or MUST.
    - Every requirement SHALL have at least one scenario.
    - Cover success, failure, and edge cases where applicable.
  design:
    - Reference existing patterns before introducing new ones.
    - State transaction boundaries where affected.
  tasks:
    - Use hierarchical numbering such as 1, 1.1, and 1.2.
    - Each task SHALL be completable in one session.
    - Include explicit verification steps.
