[project]
name = "openspec-store"
version = "0.2.0"
description = "OpenSpec central store validation and tooling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
[tool.uv]
default-groups = ["dev"]
required-version = ">=0.11.15"
python-preference = "only-managed"
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "scripts/test-version-authority-governance.py"]
addopts = "--ignore=openspec/changes -p no:cacheprovider"
[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "openspec/changes/archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
